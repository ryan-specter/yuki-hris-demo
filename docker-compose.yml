services:
  hris:
    build: .
    image: yuki-hris-demo
    ports:
      - "3000:3000"
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      HRIS_DB: /data/hris.db
    volumes:
      - hris-data:/data
    # Longer than SHUTDOWN_GRACE_MS so the app finishes draining before Docker
    # escalates to SIGKILL.
    stop_grace_period: 20s
    restart: unless-stopped

volumes:
  hris-data:
